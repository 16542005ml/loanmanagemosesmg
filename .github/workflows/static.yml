# Deploy static frontend content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static files
        run: |
          mkdir -p _site
          # Copy all HTML pages
          cp *.html _site/ 2>/dev/null || true
          # Copy JS, CSS, images
          cp -r js _site/ 2>/dev/null || true
          cp -r style _site/ 2>/dev/null || true
          cp *.webp _site/ 2>/dev/null || true
          cp *.png _site/ 2>/dev/null || true
          cp *.ico _site/ 2>/dev/null || true
          # Do NOT copy backend, node_modules, .env, or secrets

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
