<!DOCTYPE html>
<html lang="en">
<head>
  <script src="utils/security.js"></script>
  <meta charset="UTF-8">
  <title>Meeting Center - TLMS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TLMS Meeting Center - schedule meetings, manage attendance, and generate minutes.">
  <link rel="stylesheet" href="style/home.css">
  <link rel="stylesheet" href="style/designTokens.css">
  <style>
    .meeting-dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .meeting-card {
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(0, 224, 255, 0.15);
      border-radius: 12px;
      padding: 18px 16px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .meeting-card h3 {
      margin: 0 0 10px;
      font-size: 0.95rem;
      color: #00e0ff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .meeting-card strong {
      font-size: 1.8rem;
      color: #fff;
    }
    .meeting-banner {
      margin: 18px 0 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .meeting-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 24px;
    }
    .meeting-actions .main-btn {
      background: linear-gradient(90deg,#00e0ff,#0077ff);
      border:none;
      color:#000;
      padding:10px 16px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      min-width:212px;
    }
    .meeting-actions .dropdown-wrap {
      position: relative;
      display: inline-block;
    }
    .meeting-actions .dropdown-button {
      background: rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.08);
      color:#fff;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .meeting-actions .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 220px;
      background: rgba(10,18,40,0.98);
      border: 1px solid rgba(0,224,255,0.12);
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
      padding: 10px;
      display: none;
      z-index: 1000;
    }
    .meeting-actions .dropdown-menu.active {
      display: block;
    }
    .meeting-actions .dropdown-menu button {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: #e8eaf6;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .meeting-actions .dropdown-menu button:hover {
      background: rgba(0, 224, 255, 0.1);
    }
    .meeting-section {
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(0, 224, 255, 0.15);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .meeting-section h2 {
      margin-top: 0;
      color: #fff;
      font-size: 1.2rem;
    }
    .meeting-section .section-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .meeting-section .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .meeting-section label {
      font-size: 12px;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .meeting-section input,
    .meeting-section select,
    .meeting-section textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: #e8eaf6;
      padding: 10px 12px;
      font-size: 13px;
    }
    .meeting-section textarea {
      resize: vertical;
      min-height: 80px;
    }
    .meeting-section .full-width {
      grid-column: 1 / -1;
    }
    .meeting-table-wrapper {
      overflow-x: auto;
      margin-top: 12px;
    }
    .meeting-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 960px;
    }
    .meeting-table th,
    .meeting-table td {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      color: #dfe7ff;
      font-size: 13px;
      text-align: left;
    }
    .meeting-table th {
      color: #a3dafe;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(255,255,255,0.02);
      position: sticky;
      top: 0;
    }
    .meeting-table tr:hover {
      background: rgba(0, 224, 255, 0.07);
    }
    .meeting-table .action-buttons button {
      margin-right: 8px;
      margin-bottom: 4px;
    }
    .meeting-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .meeting-tag {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      color: #cfd8fc;
    }
    .meeting-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }
    .meeting-flow-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(0, 224, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .meeting-flow-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 224, 255, 0.1);
    }
    .meeting-flow-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }
    .meeting-flow-title {
      font-size: 1.1rem;
      color: #00e0ff;
      font-weight: 700;
      margin: 0 0 4px 0;
    }
    .meeting-flow-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #a3dafe;
    }
    .meeting-flow-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 13px;
      color: #e0f7ff;
    }
    .meeting-flow-details div {
      display: flex;
      flex-direction: column;
    }
    .meeting-flow-details div span:first-child {
      font-size: 11px;
      opacity: 0.6;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .meeting-flow-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      margin-top: 4px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 8px;
    }
    .meeting-flow-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 12px;
    }
    .meeting-panel {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
    }
    .meeting-panel-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .meeting-panel-card {
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(0,224,255,0.12);
      border-radius: 12px;
      padding: 16px;
    }
    .meeting-panel-card h3 {
      margin-top: 0;
      font-size: 1rem;
      color: #e0f7ff;
    }
    @media (max-width: 980px) {
      .meeting-section .section-row,
      .meeting-panel {
        grid-template-columns: 1fr;
      }
      .meeting-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .meeting-actions .main-btn,
      .meeting-actions .dropdown-button {
        width: 100%;
      }
    }
  </style>
</head>
<body data-page="meeting-center">
  <div class="top-header">
    <div class="header-title-wrap">
      <button type="button" class="sidebar-toggle" onclick="toggleSidebarNav()" aria-label="Toggle navigation" aria-expanded="false">Menu</button>
      <h1 class="header-desktop-title">TLMS Meeting Center</h1>
      <h1 class="header-mobile-title">Meeting Center</h1>
    </div>
    <div class="top-header-actions">
      <button class="action-btn" style="background:linear-gradient(90deg,#00e0ff,#0077ff); color:#000; font-weight:700;" onclick="window.location.href='home.html'">Back to Dashboard</button>
    </div>
  </div>

  <main style="padding: 24px;">
    <section class="meeting-banner">
      <div>
        <h2 style="margin:0 0 8px; color:#fff;">Meeting Minutes Generator</h2>
        <p style="margin:0; opacity:0.7; max-width:720px;">Generate complete meeting minutes with a simple, streamlined interface.</p>
      </div>
      <div>
        <div class="meeting-actions">
          <button class="main-btn" style="background:#4caf50; color:#fff;" onclick="openGenerateMinutesDialog()">📄 Generate Minutes</button>
        </div>
      </div>
    </section>

    <section class="meeting-section">
      <h2>Meeting Details</h2>
      <div class="section-row">
        <div class="field-group">
          <label>Meeting Title</label>
          <input type="text" id="meetingTitle" placeholder="Board strategy meeting" />
        </div>
        <div class="field-group">
          <label>Meeting Type</label>
          <select id="meetingType">
            <option value="Board">Board Meeting</option>
            <option value="Executive">Executive Committee</option>
            <option value="Loan">Loan Committee</option>
            <option value="Finance">Finance Committee</option>
            <option value="AGM">Annual General Meeting (AGM)</option>
            <option value="SGM">Special General Meeting (SGM)</option>
            <option value="Custom">Custom</option>
          </select>
        </div>
        <div class="field-group">
          <label>Date</label>
          <input type="date" id="meetingDate" />
        </div>
        <div class="field-group">
          <label>Time</label>
          <input type="time" id="meetingStartTime" />
        </div>
        <div class="field-group">
          <label>Venue</label>
          <input type="text" id="meetingVenue" placeholder="Chama Boardroom" />
        </div>
        <div class="field-group">
          <label>Online Meeting Link</label>
          <input type="url" id="meetingLink" placeholder="https://meet.example.com/meeting" />
        </div>
      </div>
    </section>

    <section class="meeting-section">
      <h2>Meeting Minutes</h2>
      <div class="section-row">
        <div class="field-group full-width">
          <label>Template</label>
          <select id="minutesTemplate" onchange="applyMinutesTemplate()">
            <option value="Board">Board Meeting</option>
            <option value="Executive">Executive Committee Meeting</option>
            <option value="Loan">Loan Committee Meeting</option>
            <option value="Finance">Finance Committee Meeting</option>
            <option value="AGM">Annual General Meeting (AGM)</option>
            <option value="SGM">Special General Meeting (SGM)</option>
            <option value="Custom">Custom Template</option>
          </select>
        </div>
        <div class="field-group full-width">
          <label>Minutes Content</label>
          <textarea id="minutesBody" placeholder="Meeting discussion, resolutions, action items, decisions..." style="min-height: 300px;"></textarea>
        </div>
      </div>
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top: 16px;">
        <button class="action-btn" style="background:#4caf50; color:#fff;" onclick="saveMinutesRecord()">Save Minutes</button>
        <button class="action-btn" style="background:#0077ff;" onclick="downloadMinutesReport()">Download</button>
        <button class="action-btn" style="background:#555;" onclick="window.print()">Print</button>
      </div>
    </section>

    <section class="meeting-section">
      <h2>Send Meeting Link to Members</h2>
      <div class="section-row">
        <div class="field-group full-width">
          <label>Select Members</label>
          <select id="meetingLinkRecipients" multiple style="min-height: 120px;"></select>
        </div>
        <div class="field-group full-width">
          <label>Message (Optional)</label>
          <textarea id="meetingLinkMessage" placeholder="Add a custom message to send with the meeting link..." style="min-height: 80px;"></textarea>
        </div>
      </div>
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top: 16px;">
        <button class="action-btn" style="background:#ff9800; color:#000;" onclick="sendMeetingLinkToMembers()">📤 Send Meeting Link</button>
        <button class="action-btn" style="background:#4caf50; color:#fff;" onclick="copyMeetingLink()">📋 Copy Link</button>
      </div>
    </section>
  </main>

  <script src="js/home.js"></script>
  <script>
    const API_BASE = window.__API_BASE__ || '/api';
    
    const meetingCenterState = {
      allMeetings: [],
      selectedMeetingIds: new Set(),
      members: [],
      editingMeetingId: null,
      meetingTemplates: {
        Board: 'Meeting Header\n\nMeeting Information\n\nAttendance Register\n\nDiscussion Summary\n\nDecisions Made\n\nAction Items\n\nClosing Remarks\n\nNext Meeting Information\n\nSignatures (Chairperson & Secretary)',
        Executive: 'Meeting Header\n\nExecutive Summary\n\nAttendance Register\n\nDiscussion Summary\n\nFinancial Discussions\n\nDecisions Made\n\nAction Items\n\nClosing Remarks\n\nNext Meeting Information',
        Loan: 'Meeting Header\n\nLoan Committee Overview\n\nAttendance Register\n\nDiscussion Summary\n\nDecisions Made\n\nAction Items\n\nClosing Remarks\n\nNext Meeting Information',
        Finance: 'Meeting Header\n\nFinance Review\n\nAttendance Register\n\nDiscussion Summary\n\nFinancial Discussions\n\nDecisions Made\n\nAction Items\n\nClosing Remarks\n\nNext Meeting Information',
        AGM: 'Meeting Header\n\nAnnual General Meeting\n\nAttendance Register\n\nDiscussion Summary\n\nResolutions Passed\n\nAction Items\n\nClosing Remarks\n\nNext Meeting Information',
        SGM: 'Meeting Header\n\nSpecial General Meeting\n\nAttendance Register\n\nDiscussion Summary\n\nResolutions Passed\n\nAction Items\n\nClosing Remarks\n\nNext Meeting Information',
        Custom: 'Meeting Header\n\nMeeting Information\n\nAttendance Register\n\nDiscussion Summary\n\nDecisions Made\n\nAction Items\n\nClosing Remarks\n\nNext Meeting Information'
      }
    };

    // Load approved members dynamically
    async function loadMeetingMembers() {
      try {
        const res = await fetch(`${API_BASE}/members/approved`, {
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        meetingCenterState.members = Array.isArray(data?.data) ? data.data : (Array.isArray(data) ? data : []);
        
        // Populate member dropdowns
        const recipientsSelect = document.getElementById('meetingLinkRecipients');
        if (recipientsSelect) {
          recipientsSelect.innerHTML = meetingCenterState.members.length === 0 
            ? '<option value="">No members available</option>'
            : meetingCenterState.members.map(m => `<option value="${m.id}">${m.full_name || m.name} (${m.email})</option>`).join('');
        }
      } catch (e) {
        console.error('Failed to load members:', e);
      }
    }

    // Apply template to minutes body
    function applyMinutesTemplate() {
      const templateSelect = document.getElementById('minutesTemplate');
      const minutesBody = document.getElementById('minutesBody');
      if (!templateSelect || !minutesBody) return;
      
      const selectedTemplate = templateSelect.value;
      if (meetingCenterState.meetingTemplates[selectedTemplate]) {
        minutesBody.value = meetingCenterState.meetingTemplates[selectedTemplate];
      }
    }

    // Save minutes record
    async function saveMinutesRecord() {
      const title = document.getElementById('meetingTitle')?.value;
      const type = document.getElementById('meetingType')?.value;
      const date = document.getElementById('meetingDate')?.value;
      const time = document.getElementById('meetingStartTime')?.value;
      const venue = document.getElementById('meetingVenue')?.value;
      const link = document.getElementById('meetingLink')?.value;
      const template = document.getElementById('minutesTemplate')?.value;
      const content = document.getElementById('minutesBody')?.value;

      if (!title || !date) {
        alert('Please enter meeting title and date');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/minutes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            meeting_type: type,
            meeting_date: date,
            meeting_time: time,
            venue,
            online_link: link,
            template,
            minutes_content: content
          })
        });
        const data = await res.json();
        if (data.status === 'success') {
          alert('Minutes saved successfully!');
          // Clear form
          document.getElementById('meetingTitle').value = '';
          document.getElementById('minutesBody').value = '';
        } else {
          alert('Failed to save: ' + (data.message || 'Unknown error'));
        }
      } catch (e) {
        alert('Error saving minutes: ' + e.message);
      }
    }

    // Download minutes report
    function downloadMinutesReport() {
      const title = document.getElementById('meetingTitle')?.value || 'Meeting';
      const content = document.getElementById('minutesBody')?.value || '';
      
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title.replace(/\s+/g, '_')}_minutes.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Copy meeting link
    function copyMeetingLink() {
      const link = document.getElementById('meetingLink')?.value;
      if (!link) {
        alert('No meeting link to copy');
        return;
      }
      navigator.clipboard.writeText(link).then(() => {
        alert('Link copied to clipboard!');
      }).catch(() => {
        alert('Failed to copy link');
      });
    }

    // Send meeting link to members
    async function sendMeetingLinkToMembers() {
      const link = document.getElementById('meetingLink')?.value;
      const message = document.getElementById('meetingLinkMessage')?.value;
      const recipientsSelect = document.getElementById('meetingLinkRecipients');
      
      if (!link) {
        alert('Please enter a meeting link');
        return;
      }

      const selectedMembers = Array.from(recipientsSelect?.selectedOptions || []).map(opt => opt.value);
      if (selectedMembers.length === 0) {
        alert('Please select at least one member');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/messages/send-meeting-link`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            meeting_link: link,
            message,
            member_ids: selectedMembers
          })
        });
        const data = await res.json();
        if (data.status === 'success') {
          alert('Meeting link sent successfully!');
          document.getElementById('meetingLinkMessage').value = '';
        } else {
          alert('Failed to send: ' + (data.message || 'Unknown error'));
        }
      } catch (e) {
        alert('Error sending link: ' + e.message);
      }
    }

    // Open generate minutes dialog (placeholder)
    function openGenerateMinutesDialog() {
      alert('Meeting minutes form is ready. Fill in the details below and click Save Minutes.');
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function() {
      loadMeetingMembers();
    });

    function toggleActionsDropdown() {
      const menu = document.getElementById('meetingActionsMenu');
      if (!menu) return;
      menu.classList.toggle('active');
    }

    document.addEventListener('click', function (e) {
      const menu = document.getElementById('meetingActionsMenu');
      const toggle = document.getElementById('meetingActionsToggle');
      if (!menu || !toggle) return;
      if (!toggle.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.remove('active');
      }
    });

    async function initializeMeetingCenter() {
      await loadMeetingMembers();
      await loadMeetingRecords();
      renderAgendaItems();
      applyMinutesTemplate();
    }

    async function loadMeetingMembers() {
      try {
        const rows = await apiCall('members/all?status=approved', { method: 'GET' });
        meetingCenterState.members = Array.isArray(rows) ? rows : [];
        const el = document.getElementById('attendanceMemberSelect');
        if (el) {
          el.innerHTML = '<option value="">-- Select Member --</option>' + meetingCenterState.members.map(m => `<option value="${m.id}">${m.full_name} (${m.phone || m.email || 'N/A'})</option>`).join('');
        }
      } catch (e) {
        console.warn('[loadMeetingMembers]', e.message || e);
      }
    }

    async function loadMeetingRecords() {
      try {
        const rows = await apiCall('automation/meetings', { method: 'GET' });
        meetingCenterState.allMeetings = Array.isArray(rows) ? rows : [];
        updateMeetingSummaries();
        renderMeetingRecords();
      } catch (e) {
        console.warn('[loadMeetingRecords]', e.message || e);
        meetingCenterState.allMeetings = [];
        renderMeetingRecords();
      }
    }

    function updateMeetingSummaries() {
      const now = new Date();
      const month = now.getMonth();
      const year = now.getFullYear();
      const total = meetingCenterState.allMeetings.length;
      const upcoming = meetingCenterState.allMeetings.filter(m => new Date(`${m.meeting_date}T${m.meeting_time}`) >= now).length;
      const monthCount = meetingCenterState.allMeetings.filter(m => {
        const d = new Date(m.meeting_date);
        return d.getMonth() === month && d.getFullYear() === year;
      }).length;
      const pending = meetingCenterState.allMeetings.filter(m => (m.status || 'Scheduled') === 'Pending Approval').length;
      const draft = meetingCenterState.allMeetings.filter(m => (m.status || '').toLowerCase().includes('draft')).length;
      const approved = meetingCenterState.allMeetings.filter(m => ['confirmed', 'completed'].includes((m.status || '').toLowerCase())).length;
      const attendance = total ? Math.round((approved / total) * 100) : 0;
      const actions = meetingCenterState.allMeetings.reduce((sum, m) => sum + (Number(m.action_items_pending || 0)), 0);
      document.getElementById('summaryTotalMeetings').textContent = total;
      document.getElementById('summaryUpcomingMeetings').textContent = upcoming;
      document.getElementById('summaryMonthMeetings').textContent = monthCount;
      document.getElementById('summaryPendingMeetings').textContent = pending;
      document.getElementById('summaryDraftMinutes').textContent = draft;
      document.getElementById('summaryApprovedMinutes').textContent = approved;
      document.getElementById('summaryAttendanceRate').textContent = attendance + '%';
      document.getElementById('summaryOutstandingActions').textContent = actions;
    }

    function renderMeetingRecords() {
      const grid = document.getElementById('meetingRecordsGrid');
      const search = (document.getElementById('meetingSearch')?.value || '').toLowerCase();
      const statusFilter = (document.getElementById('meetingStatusFilter')?.value || 'all');
      const rows = meetingCenterState.allMeetings.filter(m => {
        const text = `${m.title || ''} ${m.location || ''} ${m.platform || ''} ${m.target_group || ''}`.toLowerCase();
        if (search && !text.includes(search)) return false;
        if (statusFilter !== 'all' && (m.status || 'Scheduled') !== statusFilter) return false;
        return true;
      });
      if (!grid) return;
      grid.innerHTML = rows.map(m => {
        const updatedStr = m.updated_at ? new Date(m.updated_at).toLocaleString() : '-';
        const createdStr = m.created_at ? new Date(m.created_at).toLocaleDateString() : '-';
        return `
        <div class="meeting-flow-card">
          <div class="meeting-flow-header">
            <div>
              <h3 class="meeting-flow-title">${m.title || 'Untitled'}</h3>
              <div class="meeting-flow-meta">
                <span>#${m.id}</span>
                <span>•</span>
                <span style="color: ${m.status === 'Completed' ? '#4caf50' : m.status === 'Cancelled' ? '#f44336' : '#ff9800'}">${m.status || 'Scheduled'}</span>
              </div>
            </div>
            <input type="checkbox" data-id="${m.id}" onchange="toggleMeetingSelection(${m.id}, this.checked)" style="transform: scale(1.2);">
          </div>
          
          <div class="meeting-flow-details">
            <div><span>Date & Time</span><span>${m.meeting_date || '-'} at ${m.meeting_time || '-'}</span></div>
            <div><span>Venue</span><span>${m.location || '-'}</span></div>
            <div><span>Committee</span><span>${m.target_group || '-'}</span></div>
            <div><span>Organizer</span><span>${m.organizer || '-'}</span></div>
          </div>
          
          <div class="meeting-flow-desc">
             <div><span style="font-size:11px;opacity:0.6;text-transform:uppercase;">Description</span></div>
             <div style="margin-bottom:8px;">${m.description ? (m.description.length > 80 ? m.description.substring(0,80) + '...' : m.description) : 'No description provided.'}</div>
             <div style="font-size: 11px; opacity: 0.5;">Created: ${createdStr} | Updated: ${updatedStr}</div>
          </div>
          
          <div class="meeting-flow-footer">
            <div class="action-buttons" style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="action-btn" onclick="previewMeeting(${m.id})" style="font-size:11px; padding:6px 10px;">Preview</button>
              <button class="action-btn" onclick="openEditMeeting(${m.id})" style="font-size:11px; padding:6px 10px;">Edit</button>
              <button class="action-btn" onclick="shareMeetingCard(${m.id})" style="font-size:11px; padding:6px 10px; background:#ffb300; color:#000;">📤 Share Link</button>
              <button class="btn-del" onclick="deleteMeeting(${m.id})" style="font-size:11px; padding:6px 10px;">Delete</button>
            </div>
          </div>
        </div>
      `}).join('');
      if (!rows.length) grid.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; opacity:0.6; padding:18px;">No meeting records found.</div>';
    }

    function filterMeetingRecords() {
      renderMeetingRecords();
    }

    function toggleMeetingSelection(id, checked) {
      if (checked) meetingCenterState.selectedMeetingIds.add(id);
      else meetingCenterState.selectedMeetingIds.delete(id);
    }

    function toggleAllMeetingSelection(checked) {
      document.querySelectorAll('#meetingRecordsBody input[type="checkbox"]').forEach(cb => {
        cb.checked = checked;
        const id = Number(cb.dataset.id || 0);
        if (id) {
          if (checked) meetingCenterState.selectedMeetingIds.add(id);
          else meetingCenterState.selectedMeetingIds.delete(id);
        }
      });
    }

    function addAgendaItem() {
      meetingCenterState.agendaItems.push({ id: Date.now(), title: '', description: '', presenter: '', duration: '', notes: '', status: 'Pending' });
      renderAgendaItems();
    }

    function resetAgendaItems() {
      meetingCenterState.agendaItems = [];
      renderAgendaItems();
    }

    function renderAgendaItems() {
      const container = document.getElementById('agendaItemsContainer');
      if (!container) return;
      container.innerHTML = meetingCenterState.agendaItems.map((item, index) => `
        <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px;display:grid;gap:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <strong>Agenda ${index + 1}</strong>
            <div>
              <button class="action-btn" style="background:#00e0ff;color:#000;" onclick="moveAgendaItem(${item.id}, -1)">↑</button>
              <button class="action-btn" style="background:#00e0ff;color:#000;" onclick="moveAgendaItem(${item.id}, 1)">↓</button>
              <button class="btn-del" onclick="removeAgendaItem(${item.id})">Delete</button>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><label>Title</label><input type="text" value="${item.title}" onchange="updateAgendaField(${item.id}, 'title', this.value)"></div>
            <div><label>Presenter</label><input type="text" value="${item.presenter}" onchange="updateAgendaField(${item.id}, 'presenter', this.value)"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><label>Estimated Duration</label><input type="text" value="${item.duration}" onchange="updateAgendaField(${item.id}, 'duration', this.value)"></div>
            <div><label>Status</label><select onchange="updateAgendaField(${item.id}, 'status', this.value)"><option ${item.status==='Pending'?'selected':''}>Pending</option><option ${item.status==='Completed'?'selected':''}>Completed</option><option ${item.status==='In Progress'?'selected':''}>In Progress</option></select></div>
          </div>
          <div><label>Description</label><textarea onchange="updateAgendaField(${item.id}, 'description', this.value)">${item.description}</textarea></div>
          <div><label>Notes</label><textarea onchange="updateAgendaField(${item.id}, 'notes', this.value)">${item.notes}</textarea></div>
        </div>
      `).join('');
      if (!meetingCenterState.agendaItems.length) container.innerHTML = '<div style="opacity:0.7; padding:16px;">No agenda items yet. Click "Add Agenda Item" to begin.</div>';
    }

    function updateAgendaField(id, field, value) {
      const item = meetingCenterState.agendaItems.find(i => i.id === id);
      if (!item) return;
      item[field] = value;
    }

    function removeAgendaItem(id) {
      meetingCenterState.agendaItems = meetingCenterState.agendaItems.filter(i => i.id !== id);
      renderAgendaItems();
    }

    function moveAgendaItem(id, direction) {
      const index = meetingCenterState.agendaItems.findIndex(i => i.id === id);
      if (index < 0) return;
      const swapIndex = index + direction;
      if (swapIndex < 0 || swapIndex >= meetingCenterState.agendaItems.length) return;
      [meetingCenterState.agendaItems[index], meetingCenterState.agendaItems[swapIndex]] = [meetingCenterState.agendaItems[swapIndex], meetingCenterState.agendaItems[index]];
      renderAgendaItems();
    }

    function applyMinutesTemplate() {
      const template = meetingCenterState.meetingTemplates[document.getElementById('minutesTemplate')?.value || 'Board'] || '';
      const bodyEl = document.getElementById('minutesBody');
      if (!bodyEl) return;
      bodyEl.value = template;
    }

    function clearMeetingForm() {
      meetingCenterState.editingMeetingId = null;
      const defaults = {
        meetingTitle: '', meetingType: 'Board', meetingCommittee: '', meetingDepartment: '',
        meetingPurpose: '', meetingDescription: '', meetingStatus: 'Scheduled', meetingPriority: 'Normal',
        meetingConfidentiality: 'Normal', meetingOrganizer: '', meetingChairperson: '', meetingViceChair: '',
        meetingSecretary: '', meetingAssistantSecretary: '', meetingMinuteTaker: '', meetingDate: '', meetingStartTime: '',
        meetingEndTime: '', meetingVenue: '', meetingLink: '', minutesBody: ''
      };
      Object.entries(defaults).forEach(([key, value]) => {
        const el = document.getElementById(key);
        if (el) el.value = value;
      });
      ['meetingPresent', 'meetingAbsent', 'meetingApology', 'meetingGuests'].forEach(id => {
        const el = document.getElementById(id);
        if (el) Array.from(el.options).forEach(opt => opt.selected = false);
      });
      const notesEl = document.getElementById('attendanceNotes');
      if (notesEl) notesEl.value = '';

      meetingCenterState.agendaItems = [];
      renderAgendaItems();
    }

    function openScheduleDialog() {
      clearMeetingForm();
      document.getElementById('meetingTitle')?.scrollIntoView({ behavior: 'smooth' });
    }

    function openGenerateMinutesDialog() {
      document.getElementById('minutesBody')?.focus();
    }

    function previewSelectedMeeting() {
      const selectedId = Array.from(meetingCenterState.selectedMeetingIds)[0];
      if (!selectedId) return alert('Select one meeting record first.');
      previewMeeting(selectedId);
    }

    function previewMeeting(id) {
      const meeting = meetingCenterState.allMeetings.find(m => m.id === id);
      if (!meeting) return alert('Meeting not found.');
      alert(`Title: ${meeting.title || '-'}\nDate: ${meeting.meeting_date || '-'}\nTime: ${meeting.meeting_time || '-'}\nVenue: ${meeting.location || '-'}\nOrganizer: ${meeting.organizer || '-'}\nChairperson: ${meeting.chair || '-'}\nStatus: ${meeting.status || '-'}\nLink: ${meeting.meeting_url || '-'}\n\nAgenda:\n${meeting.agenda || '-'}\n\nNotes:\n${meeting.body || '-'}`);
    }

    async function openEditMeeting(id) {
      const meeting = meetingCenterState.allMeetings.find(m => m.id === id);
      if (!meeting) return alert('Meeting not found.');
      meetingCenterState.editingMeetingId = meeting.id;
      document.getElementById('meetingTitle').value = meeting.title || '';
      document.getElementById('meetingType').value = meeting.meeting_type || 'Board';
      document.getElementById('meetingCommittee').value = meeting.target_group || '';
      document.getElementById('meetingDepartment').value = meeting.department || '';
      document.getElementById('meetingPurpose').value = meeting.purpose || '';
      document.getElementById('meetingDescription').value = meeting.description || '';
      document.getElementById('meetingStatus').value = meeting.status || 'Scheduled';
      document.getElementById('meetingPriority').value = meeting.priority || 'Normal';
      document.getElementById('meetingConfidentiality').value = meeting.confidentiality || 'Normal';
      document.getElementById('meetingOrganizer').value = meeting.organizer || '';
      document.getElementById('meetingChairperson').value = meeting.chair || '';
      document.getElementById('meetingViceChair').value = meeting.vice_chair || '';
      document.getElementById('meetingSecretary').value = meeting.secretary || '';
      document.getElementById('meetingAssistantSecretary').value = meeting.assistant_secretary || '';
      document.getElementById('meetingMinuteTaker').value = meeting.minute_taker || '';
      document.getElementById('meetingDate').value = meeting.meeting_date || '';
      document.getElementById('meetingStartTime').value = meeting.meeting_time || '';
      document.getElementById('meetingEndTime').value = meeting.end_time || '';
      document.getElementById('meetingVenue').value = meeting.location || '';
      document.getElementById('meetingLink').value = meeting.meeting_url || '';
      document.getElementById('minutesBody').value = meeting.body || '';

      ['meetingPresent', 'meetingAbsent', 'meetingApology', 'meetingGuests'].forEach(id => {
        const el = document.getElementById(id);
        if (el) Array.from(el.options).forEach(opt => opt.selected = false);
      });
      document.getElementById('attendanceNotes').value = '';
      if (meeting.attendance_data) {
        try {
          const att = JSON.parse(meeting.attendance_data);
          if (att.notes) document.getElementById('attendanceNotes').value = att.notes;
          ['present', 'absent', 'apology', 'guests'].forEach(key => {
            const elId = 'meeting' + key.charAt(0).toUpperCase() + key.slice(1);
            const el = document.getElementById(elId);
            if (el && Array.isArray(att[key])) {
              Array.from(el.options).forEach(opt => {
                if (att[key].includes(opt.value)) opt.selected = true;
              });
            }
          });
        } catch (e) {
          console.warn('Failed to parse attendance_data', e);
        }
      }

      meetingCenterState.agendaItems = meeting.agenda_items ? JSON.parse(meeting.agenda_items) : [];
      renderAgendaItems();
    }

    async function deleteMeeting(id) {
      if (!confirm('Delete this meeting?')) return;
      try {
        await apiCall('automation/meetings/' + id, { method: 'DELETE' });
        alert('Meeting deleted.');
        loadMeetingRecords();
      } catch (e) {
        alert('Delete failed: ' + (e.message || e));
      }
    }

    async function saveMeetingRecord() {
      const title = (document.getElementById('meetingTitle')?.value || '').trim();
      const meetingDate = (document.getElementById('meetingDate')?.value || '').trim();
      const meetingTime = (document.getElementById('meetingStartTime')?.value || '').trim();
      const location = (document.getElementById('meetingVenue')?.value || '').trim();
      const meetingUrl = (document.getElementById('meetingLink')?.value || '').trim();
      const meetingType = (document.getElementById('meetingType')?.value || 'Board').trim();
      const committee = (document.getElementById('meetingCommittee')?.value || '').trim();
      const department = (document.getElementById('meetingDepartment')?.value || '').trim();
      const purpose = (document.getElementById('meetingPurpose')?.value || '').trim();
      const description = (document.getElementById('meetingDescription')?.value || '').trim();
      const status = (document.getElementById('meetingStatus')?.value || 'Scheduled').trim();
      const priority = (document.getElementById('meetingPriority')?.value || 'Normal').trim();
      const confidentiality = (document.getElementById('meetingConfidentiality')?.value || 'Normal').trim();
      const organizer = (document.getElementById('meetingOrganizer')?.value || '').trim();
      const chair = (document.getElementById('meetingChairperson')?.value || '').trim();
      const viceChair = (document.getElementById('meetingViceChair')?.value || '').trim();
      const secretary = (document.getElementById('meetingSecretary')?.value || '').trim();
      const assistantSecretary = (document.getElementById('meetingAssistantSecretary')?.value || '').trim();
      const minuteTaker = (document.getElementById('meetingMinuteTaker')?.value || '').trim();
      const endTime = (document.getElementById('meetingEndTime')?.value || '').trim();
      if (!title || !meetingDate || !meetingTime) return alert('Please fill in Meeting Title, Date, and Start Time.');

      const agenda = meetingCenterState.agendaItems.map((item, idx) => ({
        title: item.title || `Agenda ${idx + 1}`,
        presenter: item.presenter,
        duration: item.duration,
        description: item.description,
        status: item.status,
        notes: item.notes
      }));
      const payload = {
        title,
        meeting_date: meetingDate,
        meeting_time: meetingTime,
        location,
        platform: 'Video & Conference',
        target_group: committee || 'all',
        subsidiary_slug: 'eldoret_main',
        meeting_type: meetingType,
        department,
        status,
        priority,
        confidentiality,
        organizer,
        chair,
        vice_chair: viceChair,
        secretary,
        assistant_secretary: assistantSecretary,
        minute_taker: minuteTaker,
        purpose,
        description,
        end_time: endTime || null,
        meeting_url: meetingUrl,
        agenda_items: JSON.stringify(agenda)
      };

      const attendanceObj = {
        present: Array.from(document.getElementById('meetingPresent')?.selectedOptions || []).map(o => o.value),
        absent: Array.from(document.getElementById('meetingAbsent')?.selectedOptions || []).map(o => o.value),
        apology: Array.from(document.getElementById('meetingApology')?.selectedOptions || []).map(o => o.value),
        guests: Array.from(document.getElementById('meetingGuests')?.selectedOptions || []).map(o => o.value),
        notes: (document.getElementById('attendanceNotes')?.value || '').trim()
      };
      payload.attendance_data = JSON.stringify(attendanceObj);

      try {
        if (meetingCenterState.editingMeetingId) {
          await apiCall('automation/meetings/' + meetingCenterState.editingMeetingId, {
            method: 'PUT',
            body: JSON.stringify(payload)
          });
          alert('Meeting updated successfully.');
          meetingCenterState.editingMeetingId = null;
        } else {
          await apiCall('automation/meetings/create', {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          alert('Meeting scheduled successfully.');
        }
        loadMeetingRecords();
      } catch (e) {
        alert('Save failed: ' + (e.message || e));
      }
    }

    async function shareMeetingCard(id) {
      const m = meetingCenterState.allMeetings.find(x => x.id === id);
      if (!m) return;
      const confirmSend = confirm(`Share meeting invitation for "${m.title || 'Untitled'}" to all members?`);
      if (!confirmSend) return;
      try {
        const payload = {
          type: "meeting_invite",
          meeting_id: m.id,
          title: m.title || "Untitled Meeting",
          date: m.meeting_date || "",
          time: m.meeting_time || "",
          venue: m.location || "",
          organizer: m.organizer || "System",
          committee: m.target_group || "All Members"
        };
        await apiCall('messages/broadcast', {
          method: 'POST',
          body: JSON.stringify({ 
            subject: `Meeting Invite: ${m.title || 'Upcoming Meeting'}`, 
            body: JSON.stringify(payload), 
            target_group: m.target_group || 'all' 
          })
        });
        alert('Successfully shared meeting invitation with members!');
      } catch (e) {
        console.error(e);
        alert('An error occurred while sending the meeting link. Please try again.');
      }
    }

    async function sendMeetingLinkToMembers() {
      if (meetingCenterState.selectedMeetingIds.size === 0) {
        return alert('Please select at least one meeting to share the link for.');
      }
      
      const confirmSend = confirm(`Share meeting invitations for ${meetingCenterState.selectedMeetingIds.size} meeting(s) to all members?`);
      if (!confirmSend) return;

      try {
        let sentCount = 0;
        for (const meetingId of meetingCenterState.selectedMeetingIds) {
          const m = meetingCenterState.allMeetings.find(x => x.id === meetingId);
          if (!m) continue;
          
          const payload = {
            type: "meeting_invite",
            meeting_id: m.id,
            title: m.title || "Untitled Meeting",
            date: m.meeting_date || "",
            time: m.meeting_time || "",
            venue: m.location || "",
            organizer: m.organizer || "System",
            committee: m.target_group || "All Members"
          };
          
          await apiCall('messages/broadcast', {
            method: 'POST',
            body: JSON.stringify({ 
              subject: `Meeting Invite: ${m.title || 'Upcoming Meeting'}`, 
              body: JSON.stringify(payload), 
              target_group: m.target_group || 'all' 
            })
          });
          sentCount++;
        }
        alert(`Successfully shared ${sentCount} meeting invitation(s) with members!`);
        meetingCenterState.selectedMeetingIds.clear();
        document.querySelectorAll('input[type="checkbox"][data-id]').forEach(cb => cb.checked = false);
        if (document.getElementById('selectAllMeetings')) document.getElementById('selectAllMeetings').checked = false;
      } catch (e) {
        console.error(e);
        alert('An error occurred while sending meeting links. Please try again.');
      }
    }

    function shareMeetingLinkByEmail() { alert('Email sharing is handled through the default mail client.'); }
    function copyMeetingLink() { navigator.clipboard.writeText(document.getElementById('meetingLink')?.value || ''); alert('Meeting link copied to clipboard.'); }
    async function archiveSelectedMeetings() {
      if (!meetingCenterState.selectedMeetingIds.size) return alert('Select one or more meetings first.');
      if (!confirm('Archive selected meeting records?')) return;
      const ids = Array.from(meetingCenterState.selectedMeetingIds);
      try {
        await Promise.all(ids.map(id => apiCall('automation/meetings/' + id, {
          method: 'PUT',
          body: JSON.stringify({ status: 'Archived' })
        })));
        meetingCenterState.selectedMeetingIds.clear();
        loadMeetingRecords();
      } catch (e) {
        alert('Archive failed: ' + (e.message || e));
      }
    }
    async function restoreSelectedMeetings() {
      if (!meetingCenterState.selectedMeetingIds.size) return alert('Select one or more meetings first.');
      if (!confirm('Restore selected meeting records to scheduled?')) return;
      const ids = Array.from(meetingCenterState.selectedMeetingIds);
      try {
        await Promise.all(ids.map(id => apiCall('automation/meetings/' + id, {
          method: 'PUT',
          body: JSON.stringify({ status: 'Scheduled' })
        })));
        meetingCenterState.selectedMeetingIds.clear();
        loadMeetingRecords();
      } catch (e) {
        alert('Restore failed: ' + (e.message || e));
      }
    }
    async function deleteSelectedMeetings() {
      if (!meetingCenterState.selectedMeetingIds.size) return alert('Select meetings first.');
      if (!confirm('Delete all selected meetings? This cannot be undone.')) return;
      const ids = Array.from(meetingCenterState.selectedMeetingIds);
      try {
        await Promise.all(ids.map(id => apiCall('automation/meetings/' + id, { method: 'DELETE' })));
        meetingCenterState.selectedMeetingIds.clear();
        loadMeetingRecords();
      } catch (e) {
        alert('Bulk delete failed: ' + (e.message || e));
      }
    }
    function refreshMeetingCenter() { loadMeetingRecords(); }

    function saveMinutesRecord() {
      openGenerateMinutesDialog();
      alert('Update the minutes text and then click Save Meeting at the top to persist this meeting.');
    }

    function exportMeetingsAsPDF() {
      window.print();
      alert('Use the browser print dialog to save this page as PDF.');
    }

    function exportMeetingsAsDocx() {
      alert('DOCX export is not available in this version.');
    }

    function sendMeetingNotification() {
      sendMeetingLinkToMembers();
    }

    function shareMeetingLinkToMembers() {
      sendMeetingLinkToMembers();
    }

    document.addEventListener('DOMContentLoaded', initializeMeetingCenter);
  </script>
</body>
</html>
